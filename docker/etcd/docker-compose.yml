services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.14
    command:
      - /usr/local/bin/etcd
      - --name=phase5-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - phase5-etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  phase5-etcd-data:
