syntax = "proto3";

package distsys.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  UNKNOWN_TASK = 1;
  INVALID_REQUEST = 2;
  INTERNAL_ERROR = 3;
  TIMEOUT = 4;
  OVERLOADED = 5;
  RATE_LIMITED = 6;
}

message Envelope {
  string sender_id = 1;
  string correlation_id = 2;
  uint64 timestamp_ms = 3;
  uint32 ttl = 4;
  bytes payload = 5;
}

message TaskRequest {
  string task_name = 1;
  bytes payload_json = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

message TaskResponse {
  bool success = 1;
  bytes result_json = 2;
  Error error = 3;
  uint64 processing_time_us = 4;
}
