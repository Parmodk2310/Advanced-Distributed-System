syntax = "proto3";

package distsys.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  UNKNOWN_TASK = 1;
  INVALID_REQUEST = 2;
  INTERNAL_ERROR = 3;
  TIMEOUT = 4;
  OVERLOADED = 5;
  RATE_LIMITED = 6;
  NO_ROUTE = 7;
  PEER_UNAVAILABLE = 8;
  CAUSAL_UNAVAILABLE = 9;
  REPLICATION_BACKPRESSURE = 10;
  KEY_NOT_FOUND = 11;
  PERSISTENCE_UNAVAILABLE = 12;
  PERSISTENCE_BACKPRESSURE = 13;
  RECOVERY_IN_PROGRESS = 14;
  COORDINATION_UNAVAILABLE = 15;
  TLS_AUTHENTICATION_FAILED = 16;
}

enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  ALIVE = 1;
  SUSPECT = 2;
  DEAD = 3;
}

enum CrdtType {
  CRDT_TYPE_UNSPECIFIED = 0;
  GCOUNTER = 1;
  PNCOUNTER = 2;
  ORSET = 3;
  MVREGISTER = 4;
}

message Envelope {
  string sender_id = 1;
  string correlation_id = 2;
  uint64 timestamp_ms = 3;
  uint32 ttl = 4;
  bytes payload = 5;
  string traceparent = 6;
  string tracestate = 7;
}
message TaskRequest { string task_name = 1; bytes payload_json = 2; string routing_key = 3; }
message Error { ErrorCode code = 1; string message = 2; }
message TaskResponse { bool success = 1; bytes result_json = 2; Error error = 3; uint64 processing_time_us = 4; }
message ClusterMember { string node_id = 1; string host = 2; uint32 port = 3; MemberStatus status = 4; uint64 incarnation = 5; }
message JoinRequest { ClusterMember member = 1; }
message JoinResponse { repeated ClusterMember members = 1; }
message Ping { repeated ClusterMember gossip = 1; }
message Ack { bool success = 1; string target_node_id = 2; repeated ClusterMember gossip = 3; }
message PingRequest { ClusterMember target = 1; repeated ClusterMember gossip = 2; }
message Gossip { repeated ClusterMember members = 1; }
message ForwardedTaskRequest { TaskRequest request = 1; string origin_node_id = 2; uint32 remaining_timeout_ms = 3; }

message CausalActor { string node_id = 1; uint64 incarnation = 2; }
message Dot { CausalActor actor = 1; uint64 counter = 2; }
message VersionEntry { CausalActor actor = 1; uint64 counter = 2; }
message VersionVector { repeated VersionEntry entries = 1; }
message CausalToken { VersionVector version = 1; }

message GCounterComponent { CausalActor actor = 1; uint64 value = 2; }
message GCounterState { repeated GCounterComponent components = 1; }
message PNCounterState { GCounterState positive = 1; GCounterState negative = 2; }
message ORSetAdd { string element = 1; repeated Dot dots = 2; }
message ORSetState { repeated ORSetAdd adds = 1; repeated Dot removed = 2; }
message RegisterValue { Dot dot = 1; bytes value_json = 2; }
message MVRegisterState { repeated RegisterValue values = 1; repeated Dot superseded = 2; }

message CrdtState {
  string key = 1;
  CrdtType crdt_type = 2;
  VersionVector state_version = 3;
  VersionVector causal_context = 4;
  oneof state {
    GCounterState gcounter = 5;
    PNCounterState pncounter = 6;
    ORSetState orset = 7;
    MVRegisterState mvregister = 8;
  }
}

message IncrementMutation { uint64 amount = 1; }
message DecrementMutation { uint64 amount = 1; }
message SetAddMutation { string element = 1; }
message SetRemoveMutation { string element = 1; }
message RegisterWriteMutation { bytes value_json = 1; }

message CrdtMutationRequest {
  string key = 1;
  CrdtType crdt_type = 2;
  CausalToken causal_token = 3;
  bool forwarded = 4;
  string origin_node_id = 5;
  uint32 remaining_timeout_ms = 6;
  oneof mutation {
    IncrementMutation increment = 7;
    DecrementMutation decrement = 8;
    SetAddMutation set_add = 9;
    SetRemoveMutation set_remove = 10;
    RegisterWriteMutation register_write = 11;
  }
}

message CrdtReadRequest {
  string key = 1;
  CausalToken causal_token = 2;
  bool forwarded = 3;
  string origin_node_id = 4;
  uint32 remaining_timeout_ms = 5;
}

message CrdtReplicate { CrdtState state = 1; }
message CrdtFetch { string key = 1; }
message CrdtDigestEntry { string key = 1; CrdtType crdt_type = 2; VersionVector state_version = 3; VersionVector causal_context = 4; }
message CrdtDigest { string requester_node_id = 1; repeated CrdtDigestEntry entries = 2; uint32 batch_size = 3; }
message CrdtDigestResponse { repeated CrdtDigestEntry entries = 1; }
message CrdtResponse {
  bool success = 1;
  CrdtType crdt_type = 2;
  bytes value_json = 3;
  CausalToken causal_token = 4;
  string served_by = 5;
  bool repair_performed = 6;
  Error error = 7;
  CrdtState state = 8;
  VersionVector peer_frontier = 9;
}
