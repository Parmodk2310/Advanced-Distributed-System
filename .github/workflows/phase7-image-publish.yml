name: Phase 7 Image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to GHCR
        required: false
        default: false
        type: boolean
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - requirements-dev.txt
      - src/**
      - deploy/**
      - scripts/phase7/**
      - tests/deployment/**
      - .github/policies/**
      - .github/workflows/phase7-image-publish.yml
concurrency:
  group: phase7-image-${{ github.ref }}
  cancel-in-progress: true
permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write
env:
  PUBLISHED_IMAGE: ghcr.io/parmodk2310/distsys-node:${{ github.sha }}
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements-dev.txt && python -m pip install -e .
      - run: python -m pytest tests/deployment -q
      - uses: azure/setup-helm@v4
        with: {version: v3.17.3}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.32.2}
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.26.0}
      - name: Helm lint and render
        run: |
          mkdir -p .phase7/rendered .phase7/evidence
          helm lint deploy/helm/distributed-system -f deploy/helm/distributed-system/values-kind.yaml
          helm lint deploy/helm/etcd -f deploy/helm/etcd/values-eks.yaml
          helm template phase7 deploy/helm/distributed-system -n distsys -f deploy/helm/distributed-system/values-kind.yaml > .phase7/rendered/app-kind.yaml
          helm template phase7-etcd deploy/helm/etcd -n distsys -f deploy/helm/etcd/values-eks.yaml > .phase7/rendered/etcd-eks.yaml
          helm template phase7 deploy/helm/distributed-system -n distsys -f deploy/helm/distributed-system/values-eks.yaml --set image.repository=example.invalid/distsys-node --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > .phase7/rendered/app-eks.yaml
      - name: Kubernetes schema and policy validation
        run: |
          for f in .phase7/rendered/*.yaml; do
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary < "$f"
          done
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.58.0 test --namespace phase7.kubernetes --policy /project/.github/policies /project/.phase7/rendered
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: distsys-node:phase7-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect image
        env: {IMAGE: "distsys-node:phase7-${{ github.sha }}"}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}')" = '["python","-m","distsys.main"]'
          docker run --rm --entrypoint python "$IMAGE" -c 'import distsys; print("import-ok")'
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "distsys-node:phase7-${{ github.sha }}", severity: "HIGH,CRITICAL", ignore-unfixed: false, exit-code: "1"}
      - uses: anchore/sbom-action@v0
        with: {image: "distsys-node:phase7-${{ github.sha }}", format: spdx-json, output-file: .phase7/evidence/sbom.spdx.json}
      - name: Live kind verification of exact image
        env:
          PHASE7_SKIP_BUILD: "1"
          PHASE7_IMAGE: distsys-node:phase7-${{ github.sha }}
          PHASE7_HELM_TIMEOUT: 2m
        run: |
          bash scripts/phase7/cluster_up.sh
          python scripts/phase7/verify_cluster.py --output .phase7/evidence/cluster.json
          python scripts/phase7/verify_persistence.py --output .phase7/evidence/persistence.json
          bash scripts/phase7/verify_rollback.sh
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Publish exact verified image
        id: publish
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env: {GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "distsys-node:phase7-${{ github.sha }}" "$PUBLISHED_IMAGE"
          docker push "$PUBLISHED_IMAGE"
          digest="$(crane digest "$PUBLISHED_IMAGE")"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '{"source_commit":"%s","image":"%s","manifest_digest":"%s"}\n' "${{ github.sha }}" "$PUBLISHED_IMAGE" "$digest" > .phase7/evidence/provenance.json
      - name: Keyless-sign immutable digest
        if: steps.publish.outputs.digest != ''
        run: cosign sign --yes "$PUBLISHED_IMAGE@${{ steps.publish.outputs.digest }}"
      - name: Attest public-repository provenance
        if: steps.publish.outputs.digest != '' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/parmodk2310/distsys-node
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: phase7-image-evidence, path: .phase7/evidence/*, retention-days: 7, if-no-files-found: ignore}
      - name: Always clean
        if: always()
        run: bash scripts/phase7/cluster_down.sh
