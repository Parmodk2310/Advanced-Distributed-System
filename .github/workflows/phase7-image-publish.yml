name: Phase 7 Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - requirements.txt
      - src/**
      - tests/deployment/test_container_contract.py
      - tests/deployment/test_helm_contract.py
      - deploy/helm/**
      - deploy/kind/**
      - deploy/k3d/**
      - scripts/phase7/**
      - tests/deployment/test_phase7_*.py
      - .github/workflows/phase7-image-publish.yml

concurrency:
  group: phase7-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-image:
    name: Build and inspect immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install contract-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -e .

      - name: Verify container contract
        run: |
          python -m pytest tests/deployment/test_container_contract.py tests/deployment/test_helm_contract.py -q
          python -m ruff check tests/deployment
          python -m black --check tests/deployment

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.26.0

      - name: Validate Helm release contract
        run: |
          helm lint deploy/helm/distributed-system \
            --values deploy/helm/distributed-system/values-kind.yaml
          helm template phase7 deploy/helm/distributed-system \
            --namespace distsys \
            --values deploy/helm/distributed-system/values-kind.yaml \
            > /tmp/phase7-kind.yaml
          helm template phase7 deploy/helm/distributed-system \
            --namespace distsys \
            --values deploy/helm/distributed-system/values-eks.yaml \
            --set image.repository=example.invalid/distsys-node \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > /tmp/phase7-eks.yaml

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image into Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: distsys-node:phase7-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect and smoke-test image
        env:
          IMAGE: distsys-node:phase7-${{ github.sha }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}')" = '["python","-m","distsys.main"]'
          docker run --rm --entrypoint python "$IMAGE" -c 'import distsys; print("import-ok")'

      - name: Verify kind lifecycle and mTLS bootstrap
        env:
          PHASE7_SKIP_BUILD: "1"
          PHASE7_IMAGE: distsys-node:phase7-${{ github.sha }}
          PHASE7_HELM_TIMEOUT: 90s
        run: |
          bash scripts/phase7/cluster_up.sh
          kubectl -n distsys get pods,pvc,svc
          kubectl -n distsys get statefulset phase7-distributed-system \
            -o jsonpath='{.status.readyReplicas}' | grep -qx '3'
          python scripts/phase7/verify_cluster.py --output .phase7/evidence/cluster.json
          python scripts/phase7/verify_persistence.py --output .phase7/evidence/persistence.json
          bash scripts/phase7/verify_rollback.sh

      - name: Always clean local cluster and credentials
        if: always()
        run: bash scripts/phase7/cluster_down.sh
