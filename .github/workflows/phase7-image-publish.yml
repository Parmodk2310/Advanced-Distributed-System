name: Phase 7 Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - requirements.txt
      - src/**
      - tests/deployment/test_container_contract.py
      - tests/deployment/test_helm_contract.py
      - deploy/helm/**
      - deploy/kind/**
      - deploy/k3d/**
      - scripts/phase7/**
      - tests/deployment/test_phase7_*.py
      - .github/workflows/phase7-image-publish.yml

concurrency:
  group: phase7-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  PUBLISHED_IMAGE: ghcr.io/parmodk2310/distsys-node:${{ github.sha }}

jobs:
  verify-image:
    name: Build and inspect immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install contract-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -e .

      - name: Verify container contract
        run: |
          python -m pytest tests/deployment/test_container_contract.py tests/deployment/test_helm_contract.py -q
          python -m ruff check tests/deployment
          python -m black --check tests/deployment

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.26.0

      - name: Validate Helm release contract
        run: |
          mkdir -p .phase7/rendered .phase7/evidence
          helm lint deploy/helm/distributed-system \
            --values deploy/helm/distributed-system/values-kind.yaml
          helm template phase7 deploy/helm/distributed-system \
            --namespace distsys \
            --values deploy/helm/distributed-system/values-kind.yaml \
            > .phase7/rendered/phase7-kind.yaml
          helm template phase7 deploy/helm/distributed-system \
            --namespace distsys \
            --values deploy/helm/distributed-system/values-eks.yaml \
            --set image.repository=example.invalid/distsys-node \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > .phase7/rendered/phase7-eks.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary < .phase7/rendered/phase7-kind.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary < .phase7/rendered/phase7-eks.yaml
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.58.0 \
            test --policy /project/.github/policies /project/.phase7/rendered

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image into Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          push: false
          tags: distsys-node:phase7-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect and smoke-test image
        env:
          IMAGE: distsys-node:phase7-${{ github.sha }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}')" = '["python","-m","distsys.main"]'
          docker run --rm --entrypoint python "$IMAGE" -c 'import distsys; print("import-ok")'

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: distsys-node:phase7-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: distsys-node:phase7-${{ github.sha }}
          format: spdx-json
          output-file: .phase7/evidence/sbom.spdx.json

      - name: Verify kind lifecycle and mTLS bootstrap
        env:
          PHASE7_SKIP_BUILD: "1"
          PHASE7_IMAGE: distsys-node:phase7-${{ github.sha }}
          PHASE7_HELM_TIMEOUT: 90s
        run: |
          bash scripts/phase7/cluster_up.sh
          kubectl -n distsys get pods,pvc,svc
          kubectl -n distsys get statefulset phase7-distributed-system \
            -o jsonpath='{.status.readyReplicas}' | grep -qx '3'
          python scripts/phase7/verify_cluster.py --output .phase7/evidence/cluster.json
          python scripts/phase7/verify_persistence.py --output .phase7/evidence/persistence.json
          bash scripts/phase7/verify_rollback.sh

      - name: Publish the verified immutable image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "distsys-node:phase7-${{ github.sha }}" "$PUBLISHED_IMAGE"
          docker push "$PUBLISHED_IMAGE"
          digest="$(docker image inspect "$PUBLISHED_IMAGE" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image provenance
        if: steps.publish.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/parmodk2310/distsys-node
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-image-evidence
          path: .phase7/evidence/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Always clean local cluster and credentials
        if: always()
        run: bash scripts/phase7/cluster_down.sh
