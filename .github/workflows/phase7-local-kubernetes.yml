name: Phase 7 Local Kubernetes
on:
  workflow_dispatch:
  push:
    paths: ["Dockerfile", "deploy/**", "scripts/phase7/**", "tests/deployment/**", ".github/workflows/phase7-*.yml"]
  pull_request:
    paths: ["Dockerfile", "deploy/**", "scripts/phase7/**", "tests/deployment/**", ".github/workflows/phase7-*.yml"]
concurrency:
  group: phase7-local-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terraform-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: {terraform_version: 1.9.8}
      - working-directory: deploy/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
  local-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements-dev.txt && python -m pip install -e .
      - uses: azure/setup-helm@v5
        with: {version: v3.17.3}
      - uses: azure/setup-kubectl@v5
        with: {version: v1.32.2}
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.26.0}
      - uses: hashicorp/setup-terraform@v4
        with: {terraform_version: 1.9.8}
      - uses: docker/setup-buildx-action@v4
      - name: Deployment contracts
        run: python -m pytest tests/deployment -q
      - name: Live Phase 7A release gate
        run: bash scripts/phase7/release_gate.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase7-local-evidence
          path: .phase7/evidence/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Always clean
        if: always()
        run: bash scripts/phase7/cluster_down.sh
