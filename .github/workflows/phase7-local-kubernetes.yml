name: Phase 7 Local Kubernetes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "deploy/**", "scripts/phase7/**", "tests/deployment/**", ".github/workflows/phase7-*.yml"]
  pull_request:
    branches: [main]
    paths: ["Dockerfile", "deploy/**", "scripts/phase7/**", "tests/deployment/**", ".github/workflows/phase7-*.yml"]
concurrency:
  group: phase7-local-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terraform-static:
    name: Terraform static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: 1.9.8}
      - working-directory: deploy/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
  local-release:
    name: Local kind release verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements-dev.txt && python -m pip install -e .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: {version: v3.17.3}
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with: {version: v1.32.2}
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with: {install_only: true, version: v0.26.0}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: 1.9.8}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Deployment contracts
        run: python -m pytest tests/deployment -q
      - name: Live Phase 7A release gate
        run: bash scripts/phase7/release_gate.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase7-local-evidence
          path: .phase7/evidence/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Always clean
        if: always()
        run: bash scripts/phase7/cluster_down.sh
