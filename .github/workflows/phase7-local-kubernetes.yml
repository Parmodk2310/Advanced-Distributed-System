name: Phase 7 Local Kubernetes
on:
  workflow_dispatch:
  pull_request:
    paths: ["Dockerfile", "deploy/**", "scripts/phase7/**", "tests/deployment/**", ".github/workflows/phase7-*.yml"]
concurrency:
  group: phase7-local-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  local-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements-dev.txt && python -m pip install -e .
      - uses: azure/setup-helm@v4
        with: {version: v3.17.3}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.32.2}
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.26.0}
      - uses: docker/setup-buildx-action@v3
      - name: Deployment contracts
        run: python -m pytest tests/deployment -q
      - name: Live kind release gate
        run: bash scripts/phase7/release_gate.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: phase7-local-evidence, path: .phase7/evidence/*.json, retention-days: 7, if-no-files-found: ignore}
      - name: Always clean
        if: always()
        run: bash scripts/phase7/cluster_down.sh
