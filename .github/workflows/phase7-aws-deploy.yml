name: Phase 7 AWS Deploy
on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply-demo or destroy"
        required: true
        type: choice
        options: [apply-demo, destroy]
      expected_commit:
        description: "Exact approved source commit"
        required: true
        type: string
      approved_ghcr_digest:
        description: "Approved GHCR sha256 digest"
        required: true
        type: string
      reviewed_plan_run_id:
        description: "AWS Plan workflow run ID (required for apply-demo)"
        required: false
        type: string
      confirmation:
        description: "Type PHASE7_EKS_APPROVED"
        required: true
        type: string
permissions:
  actions: read
  contents: read
  id-token: write
  packages: read
concurrency:
  group: phase7-aws-demo
  cancel-in-progress: false
jobs:
  controlled-action:
    if: vars.AWS_PHASE7_ENABLED == 'true' && inputs.expected_commit == github.sha && inputs.confirmation == 'PHASE7_EKS_APPROVED'
    environment: phase7-aws-demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_owner: ${{ vars.PHASE7_OWNER }}
      TF_VAR_expires_at: ${{ vars.PHASE7_EXPIRES_AT }}
      TF_VAR_budget_email: ${{ secrets.PHASE7_BUDGET_EMAIL }}
      TF_VAR_kubernetes_api_cidrs: ${{ vars.PHASE7_API_CIDRS_JSON }}
      TF_VAR_enable_eks: "true"
      GHCR_IMAGE: ghcr.io/parmodk2310/distsys-node@${{ inputs.approved_ghcr_digest }}
      GH_TOKEN: ${{ github.token }}
      PHASE7_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      PHASE7_TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require immutable digest and matching commit
        run: |
          [[ "${{ inputs.approved_ghcr_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with: {role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: ap-south-1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: inputs.action == 'apply-demo'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Phase 7 verification dependencies
        if: inputs.action == 'apply-demo'
        run: python -m pip install -e .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: 1.9.8}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with: {version: v3.17.3}
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with: {version: v1.32.2}
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Configure remote Terraform state
        run: |
          mkdir -p .phase7/evidence
          cat > .phase7/backend.hcl <<EOF
          bucket = "${{ vars.TF_STATE_BUCKET }}"
          key = "advanced-distributed-system/phase7.tfstate"
          region = "ap-south-1"
          encrypt = true
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          EOF
          chmod 600 .phase7/backend.hcl
          terraform -chdir=deploy/terraform/aws init -input=false -reconfigure -backend-config="$GITHUB_WORKSPACE/.phase7/backend.hcl"
      - name: Download and checksum reviewed plan
        if: inputs.action == 'apply-demo'
        run: |
          test -n "${{ inputs.reviewed_plan_run_id }}"
          mkdir -p .phase7/reviewed
          gh run download "${{ inputs.reviewed_plan_run_id }}" --repo "${{ github.repository }}" --name "phase7-reviewed-plan-${{ github.sha }}" --dir .phase7/reviewed
          (cd .phase7/reviewed && sha256sum -c phase7-plan.sha256)
      - name: Apply exactly the reviewed plan
        if: inputs.action == 'apply-demo'
        run: terraform -chdir=deploy/terraform/aws apply -input=false "$GITHUB_WORKSPACE/.phase7/reviewed/phase7.tfplan"
      - name: Temporarily authorize GitHub runner for EKS API
        id: eks_api_access
        env:
          ACTION: ${{ inputs.action }}
          CHECK_IP_HOST: checkip.amazonaws.com
        run: |
          cluster="$(
            terraform -chdir=deploy/terraform/aws output -json 2>/dev/null |
            jq -r '.cluster_name.value // empty' || true
          )"

          if [[ -z "$cluster" ]]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"

            if [[ "$ACTION" == "destroy" ]]; then
              echo "No Terraform cluster output; Kubernetes cleanup will be skipped"
              exit 0
            fi

            echo "No EKS cluster output during apply-demo" >&2
            exit 1
          fi

          runner_ip="$(curl -4 --fail --silent "https://${CHECK_IP_HOST}")"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          runner_cidr="${runner_ip}/32"

          approved_cidrs="$(
            jq -ce '
              if type == "array"
                 and length > 0
                 and all(.[]; type == "string")
                 and index("0.0.0.0/0") == null
              then .
              else error("invalid approved EKS API CIDRs")
              end
            ' <<< "$TF_VAR_kubernetes_api_cidrs"
          )"

          temporary_cidrs="$(
            jq -cn \
              --argjson approved "$approved_cidrs" \
              --arg runner "$runner_cidr" \
              '$approved + [$runner] | unique'
          )"

          mkdir -p .phase7
          printf '%s' "$cluster" > .phase7/eks-cluster-name
          printf '%s' "$approved_cidrs" > .phase7/approved-api-cidrs.json

          vpc_config="$(
            jq -cn \
              --argjson cidrs "$temporary_cidrs" \
              '{
                endpointPrivateAccess: true,
                endpointPublicAccess: true,
                publicAccessCidrs: $cidrs
              }'
          )"

          if ! aws eks update-cluster-config \
            --region ap-south-1 \
            --name "$cluster" \
            --resources-vpc-config "$vpc_config"
          then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            if [[ "$ACTION" == "destroy" ]]; then
              echo "Runner authorization failed; continuing to Terraform destroy"
              exit 0
            fi
            exit 1
          fi

          aws eks wait cluster-active \
            --region ap-south-1 \
            --name "$cluster"

          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"
      - name: Configure kubeconfig
        if: steps.eks_api_access.outputs.authorized == 'true'
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name "${{ steps.eks_api_access.outputs.cluster }}"
      - name: Promote exact GHCR artifact into ECR without rebuilding
        if: inputs.action == 'apply-demo'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ecr_repo="$(terraform -chdir=deploy/terraform/aws output -raw ecr_repository_url)"
          registry="${ecr_repo%%/*}"
          aws ecr get-login-password --region ap-south-1 | crane auth login "$registry" -u AWS --password-stdin
          export ECR_IMAGE="$ecr_repo:${{ github.sha }}"
          target_digest="$(bash scripts/phase7/promote_ghcr_to_ecr.sh)"
          printf '%s' "$target_digest" > .phase7/ecr-digest
          printf '%s' "$ecr_repo" > .phase7/ecr-repository
      - name: Deploy etcd then the distributed system
        if: inputs.action == 'apply-demo'
        run: |
          kubectl create namespace distsys --dry-run=client -o yaml | kubectl apply -f -
          bash scripts/phase7/generate_tls_secret.sh
          helm upgrade --install phase7-etcd deploy/helm/etcd -n distsys -f deploy/helm/etcd/values-eks.yaml --wait --timeout 5m
          ecr_repo="$(cat .phase7/ecr-repository)"
          digest="$(cat .phase7/ecr-digest)"
          helm upgrade --install phase7 deploy/helm/distributed-system -n distsys -f deploy/helm/distributed-system/values-eks.yaml --set image.repository="$ecr_repo" --set image.digest="$digest" --wait --timeout 5m
      - name: Private EKS, persistence and rollback verification
        if: inputs.action == 'apply-demo'
        run: |
          bash scripts/phase7/verify_eks.sh
          PYTHONPATH=src python scripts/phase7/verify_persistence.py --output .phase7/evidence/eks-persistence.json
          bash scripts/phase7/verify_rollback.sh
      - name: Temporary external verification
        if: inputs.action == 'apply-demo'
        run: |
          bash scripts/phase7/enable_public_endpoint.sh
          for i in $(seq 1 60); do
            host="$(kubectl -n distsys get svc phase7-public -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            [[ -n "$host" ]] && break
            sleep 5
          done
          test -n "${host:-}"
          PYTHONPATH=src python scripts/phase7/verify_public_endpoint.py --host "$host" \
            --readiness-timeout 300 \
            --poll-interval 5 \
            --output .phase7/evidence/eks-public.json
      - name: Always remove temporary external endpoint
        if: always() && inputs.action == 'apply-demo' && steps.eks_api_access.outputs.authorized == 'true'
        run: bash scripts/phase7/disable_public_endpoint.sh
      - name: Destroy application, etcd and AWS infrastructure
        if: always() && inputs.action == 'destroy'
        env:
          KUBERNETES_ACCESS_READY: ${{ steps.eks_api_access.outputs.authorized }}
        run: |
          if [[ "$KUBERNETES_ACCESS_READY" == "true" ]]; then
            bash scripts/phase7/disable_public_endpoint.sh || true
            helm -n distsys uninstall phase7 --wait --timeout 5m || true
            helm -n distsys uninstall phase7-etcd --wait --timeout 5m || true
            kubectl -n distsys delete pvc --all --wait=true --timeout=5m || true
            if bash scripts/phase7/wait_for_ebs_deletion.sh; then
              echo "EBS convergence completed"
            else
              waiter_status=$?
              echo "EBS convergence check failed or timed out (exit ${waiter_status}); continuing to Terraform destroy" >&2
            fi
          else
            echo "Kubernetes API unavailable; continuing directly to Terraform destroy"
          fi
          terraform -chdir=deploy/terraform/aws destroy -input=false -auto-approve
          bash scripts/phase7/verify_aws_teardown.sh > .phase7/evidence/aws-teardown.json
      - name: Always restore approved EKS API CIDRs
        if: always()
        run: |
          cluster_file=".phase7/eks-cluster-name"
          cidrs_file=".phase7/approved-api-cidrs.json"

          if [[ ! -s "$cluster_file" || ! -s "$cidrs_file" ]]; then
            echo "Temporary EKS API authorization was not established"
            exit 0
          fi

          cluster="$(cat "$cluster_file")"
          approved_cidrs="$(cat "$cidrs_file")"

          if ! aws eks describe-cluster \
            --region ap-south-1 \
            --name "$cluster" \
            >/dev/null 2>&1
          then
            echo "EKS cluster no longer exists; no CIDR restoration required"
            exit 0
          fi

          echo "Restore approved EKS API CIDRs"

          vpc_config="$(
            jq -cn \
              --argjson cidrs "$approved_cidrs" \
              '{
                endpointPrivateAccess: true,
                endpointPublicAccess: true,
                publicAccessCidrs: $cidrs
              }'
          )"

          aws eks update-cluster-config \
            --region ap-south-1 \
            --name "$cluster" \
            --resources-vpc-config "$vpc_config"

          aws eks wait cluster-active \
            --region ap-south-1 \
            --name "$cluster"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: {name: "phase7-aws-evidence-${{ github.sha }}", path: .phase7/evidence/*.json, retention-days: 7, if-no-files-found: ignore}
