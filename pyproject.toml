[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-distributed-system"
version = "0.7.0"
description = "Correctness-first distributed infrastructure for reliable AI/ML services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "protobuf>=4.25,<7",
  "etcd3gw>=2.7,<3",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10",
  "grpcio-tools==1.84.0",
  "types-protobuf==7.35.1.20260906",
  "PyYAML>=6.0,<7",
]

[project.scripts]
distsys-node = "distsys.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "etcd: requires RUN_ETCD_INTEGRATION=1 and a live local etcd service",
  "chaos: requires RUN_CHAOS_TESTS=1 and the dedicated Phase 6 stack",
  "performance: requires RUN_PERFORMANCE_TESTS=1 and the dedicated Phase 6 stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "src/distsys/proto/messages_pb2.py",
  "src/distsys/proto/messages_pb2.pyi",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = 'src/distsys/proto/messages_pb2\.(py|pyi)$'
