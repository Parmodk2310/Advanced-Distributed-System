[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-distributed-system"
version = "0.1.0"
description = "Phase 1: reliable async TCP node with framed Protobuf protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=4.25,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10",
  "grpcio-tools>=1.60",
]

[project.scripts]
distsys-node = "distsys.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
