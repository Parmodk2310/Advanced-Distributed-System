apiVersion: v1
kind: Secret
metadata:
  name: dist-sys-tls
  namespace: distributed-system
type: Opaque
data:
  ca.crt: BASE64_ENCODED_CA_CRT
  server.crt: BASE64_ENCODED_SERVER_CRT
  server.key: BASE64_ENCODED_SERVER_KEY
---
# Generate base64 values with:
# cat certs/ca.crt | base64 -w 0
# cat certs/server.crt | base64 -w 0
# cat certs/server.key | base64 -w 0