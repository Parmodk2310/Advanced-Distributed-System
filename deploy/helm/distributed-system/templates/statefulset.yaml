apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "distributed-system.fullname" . }}
  labels:
    {{- include "distributed-system.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "distributed-system.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "distributed-system.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distributed-system.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "distributed-system.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export NODE_ID="${HOSTNAME}"
              export PERSISTENCE_DB_PATH="/data/node.db"
              export CLUSTER_SEEDS="{{ include "distributed-system.fullname" . }}-0.{{ include "distributed-system.fullname" . }}-headless:{{ .Values.service.protocolPort }},{{ include "distributed-system.fullname" . }}-1.{{ include "distributed-system.fullname" . }}-headless:{{ .Values.service.protocolPort }},{{ include "distributed-system.fullname" . }}-2.{{ include "distributed-system.fullname" . }}-headless:{{ .Values.service.protocolPort }}"
              exec python -m distsys.main
          envFrom:
            - configMapRef:
                name: {{ include "distributed-system.fullname" . }}-config
          env:
            - name: TLS_CA_FILE
              value: /certs/ca.crt
            - name: TLS_CERT_FILE
              value: /certs/tls.crt
            - name: TLS_KEY_FILE
              value: /certs/tls.key
          ports:
            - name: protocol
              containerPort: {{ .Values.service.protocolPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 2
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
