apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "distributed-system.fullname" . }}
  labels:
    {{- include "distributed-system.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "distributed-system.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      {{- include "distributed-system.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distributed-system.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "distributed-system.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: select-node-identity
          image: {{ include "distributed-system.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              cp {{ .Values.tls.sourceMountPath }}/ca.crt {{ .Values.tls.mountPath }}/ca.crt;
              cp {{ .Values.tls.sourceMountPath }}/${NODE_ID}.crt {{ .Values.tls.mountPath }}/tls.crt;
              cp {{ .Values.tls.sourceMountPath }}/${NODE_ID}.key {{ .Values.tls.mountPath }}/tls.key;
              chmod 0400 {{ .Values.tls.mountPath }}/tls.key;
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls-source
              mountPath: {{ .Values.tls.sourceMountPath }}
              readOnly: true
            - name: tls-runtime
              mountPath: {{ .Values.tls.mountPath }}
      containers:
        - name: node
          image: {{ include "distributed-system.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "distributed-system.fullname" . }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: protocol
              containerPort: {{ .Values.service.protocolPort }}
              protocol: TCP
            - name: observability
              containerPort: {{ .Values.service.observabilityPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: observability
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: observability
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: observability
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: tls-runtime
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: tls-source
          secret:
            secretName: {{ .Values.tls.secretName }}
            defaultMode: 0400
        - name: tls-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "distributed-system.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
