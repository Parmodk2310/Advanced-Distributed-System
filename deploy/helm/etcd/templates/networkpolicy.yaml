{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "etcd.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "etcd.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "etcd.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.peerPort }}}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: distributed-system
      ports:
        - {protocol: TCP, port: {{ .Values.service.clientPort }}}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "etcd.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.peerPort }}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
