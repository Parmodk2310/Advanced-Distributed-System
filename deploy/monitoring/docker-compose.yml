services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.14
    command:
      - /usr/local/bin/etcd
      - --name=phase6-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - phase6-etcd-data:/etcd-data
    healthcheck:
      test:
        [
          "CMD",
          "etcdctl",
          "--endpoints=http://127.0.0.1:2379",
          "endpoint",
          "health",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:12379:12379"
      - "127.0.0.1:19100:19100"
      - "127.0.0.1:19101:19101"
      - "127.0.0.1:19102:19102"
    depends_on:
      etcd:
        condition: service_healthy
    logging: *bounded-logging

  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - phase6-tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test:
        [
          "CMD",
          "/tempo",
          "-config.file=/etc/tempo/tempo.yml",
          "-config.verify=true",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *bounded-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=/etc/otelcol-contrib/config.yml",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *bounded-logging

  node-0:
    build:
      context: ../..
      dockerfile: deploy/monitoring/Dockerfile.node
    image: distsys-phase6-node:local
    hostname: node-0
    environment:
      NODE_ID: node-0
      NODE_HOST: node-0
      NODE_PORT: "18000"
      CPU_WORKERS: "1"
      CPU_QUEUE_CAPACITY: "100"
      RATE_LIMIT_RPS: "500"
      RATE_LIMIT_BURST: "100"
      REQUEST_TIMEOUT_SECONDS: "5"
      CLUSTER_ENABLED: "true"
      CLUSTER_SEEDS: ""
      CLUSTER_VIRTUAL_NODES: "64"
      CLUSTER_PROBE_INTERVAL_SECONDS: "0.5"
      CLUSTER_PING_TIMEOUT_SECONDS: "0.75"
      CLUSTER_INDIRECT_TIMEOUT_SECONDS: "1.5"
      CLUSTER_INDIRECT_PROBE_COUNT: "2"
      CLUSTER_SUSPICION_TIMEOUT_SECONDS: "4"
      CLUSTER_DEAD_RETENTION_SECONDS: "10"
      CLUSTER_GOSSIP_INTERVAL_SECONDS: "0.5"
      CRDT_ENABLED: "true"
      CRDT_REPLICATION_FACTOR: "3"
      CRDT_REPLICATION_QUEUE_CAPACITY: "500"
      CRDT_REPLICATION_WORKERS: "1"
      CRDT_REPLICATION_RETRY_MAX_ATTEMPTS: "3"
      CRDT_REPLICATION_RETRY_BASE_DELAY_SECONDS: "0.05"
      CRDT_REPLICATION_RETRY_MAX_DELAY_SECONDS: "0.5"
      CRDT_ANTI_ENTROPY_INTERVAL_SECONDS: "1.0"
      CRDT_ANTI_ENTROPY_BATCH_SIZE: "100"
      PERSISTENCE_ENABLED: "true"
      PERSISTENCE_DB_PATH: /data/node-0.db
      PERSISTENCE_QUEUE_CAPACITY: "100"
      PERSISTENCE_BUSY_TIMEOUT_SECONDS: "5"
      PERSISTENCE_SQLITE_SYNCHRONOUS: NORMAL
      ETCD_ENABLED: "true"
      ETCD_ENDPOINTS: http://etcd:2379
      ETCD_NAMESPACE: /distsys/v1
      ETCD_LEASE_TTL_SECONDS: "6"
      ETCD_RENEW_INTERVAL_SECONDS: "2"
      TLS_ENABLED: "true"
      MTLS_REQUIRED: "true"
      TLS_CA_FILE: /certs/ca/ca.crt
      TLS_CERT_FILE: /certs/node-0/node.crt
      TLS_KEY_FILE: /certs/node-0/node.key
      TLS_MIN_VERSION: TLSv1.3
      OBSERVABILITY_ENABLED: "true"
      OBSERVABILITY_HOST: 0.0.0.0
      OBSERVABILITY_PORT: "9100"
      METRICS_ENABLED: "true"
      TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: distsys-node
      OTEL_TRACE_SAMPLE_RATIO: "0.10"
      OTEL_EXPORT_TIMEOUT_SECONDS: "2.0"
      LOG_LEVEL: INFO
      RUN_CHAOS_TESTS: "${RUN_CHAOS_TESTS:-}"
      PHASE6_PEER_PROXY_MAP: "${PHASE6_PEER_PROXY_MAP:-}"
    volumes:
      - ../../certs/generated:/certs:ro
      - phase6-node-0-data:/data
    ports:
      - "127.0.0.1:18000:18000"
      - "127.0.0.1:9100:9100"
    depends_on:
      etcd:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health/ready', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *bounded-logging

