      - "127.0.0.1:9102:9102"
    depends_on:
      etcd:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/health/ready', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *bounded-logging

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - phase6-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      node-0:
        condition: service_healthy
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *bounded-logging

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - phase6-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *bounded-logging

volumes:
  phase6-etcd-data:
  phase6-node-0-data:
  phase6-node-1-data:
  phase6-node-2-data:
  phase6-tempo-data:
  phase6-prometheus-data:
  phase6-grafana-data:
